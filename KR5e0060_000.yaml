body:
  text: 重陽真人授丹陽二十四訣馬丹陽問重陽祖師曰甚是論祖宗性命根蒂龍虎鉛汞刀圭金公黃婆嬰兒姹女龍蛇心猿意馬賓主覺照太上三寶九星五剛三才抽添火候金丹出離三界七返行住坐卧祖師答曰宗者是性也祖者是命也名曰祖宗丹陽又問何名見性命祖師答曰性者是元神命者是元氣名曰性命也丹陽又問何名為根蒂祖師答曰根者是性命者是蒂也丹陽又問何者是龍虎祖師答曰神者是龍氣者是虎是性命也丹陽又問何者為鉛汞祖師答曰鉛者是元神汞者是元氣也名曰鉛汞丹陽又問何者名是金公黃婆祖師答曰金公是心黃婆是脾丹陽又問何者名為嬰兒姹女祖師答曰嬰兒是肝姹女是肺名曰嬰兒姹女也丹陽又問何者是心猿意馬祖師答曰心是猿意是馬也丹陽又問何者名為賓主覺照祖師答曰賓者是命主者是性也悟識真假為覺照者是自己伶俐總明為覺照也丹陽又問何者名為龍蛇祖師答曰龍者是性腎也蛇者是心中嘉氣也是不離性也丹陽又問何者名為三寶祖師答曰有內外三寶是道經師者為外三寶也內三寶者精氣神也丹陽又問何者名為太上祖師答曰太者是大之極也上者是至重高之極也名曰太上丹陽又問何者名為出家祖師答曰出家者萬緣不罣自己靈明乃是出家丹陽又問何為修行祖師答曰修者真身之道行者是性命也名為修行也丹陽又問何者名為長生不死祖師答曰是這真性不亂萬緣不掛不去不來此是長生不死也丹陽又問何名是道祖師答曰性命本宗元無得失巍不可測妙不可言乃為之道丹陽又問何者名為清靜祖師答曰有內外清靜內清靜者心不起雜念外清靜者諸塵不染著為清靜也丹陽又問何者為三命祖師答曰黃庭經云存精是元始天尊存神是太上道君存氣是太上老君名曰三命也然後再尋三命枉費工夫神氣相同太上再留方便之門轉化人道常有也在三者東華帝君是心也化十方諸靈大帝是腎也除此外不可尋也天有九星人有九竅天有四時人有四大天有地水火風人有心精氣身天有五剛地有五剛人有五剛天有三才人有三才丹陽問何名為九星祖師答曰是北斗七元星左輔右弼二星名九星丹陽問何名九竅何者名為地有五剛祖師曰恆衡岱華嵩五嶽是也人有五剛肝膽脾肺腎是也丹陽問何者天有四時春夏秋冬也人有四時四肢四大是也丹陽問何名天有地水火風人有地水火風師曰天有地水火風者金木水火土也人有地水火風者心為火精為水氣為風身為土乃是地水火風也丹陽問天有三才曰月星地有三才乙丙丁人有三才精神氣是也又曰眼為窗口為門户心腎為曰月除此一身之外不可外求丹陽問何名為抽添火候祖師答曰除一切塵垢一切雜念又神氣常存於本性不昧名曰添火候也丹陽曰何名為出家老君曰人能常清靜天地悉皆歸有功行修真之德者為出家丹陽問何名太上七返師曰一者少言語養內氣二者戒心性養精氣三者薄滋味養血氣四者戒嗔怒養肺氣五者美飲食養胃氣六者少思慮養肝氣七者寡嗜欲養心氣是也徐神翁注但精神無惱唾少為中修行人也乃三教聖人之意凡人出家絶名棄利忘情去欲則心虛心虛則氣住氣住則神清神清則德合道生矣孔子曰仁義禮智信若修行之人仁者不棄義者不汙禮者不自高智者不爭信者不妄言金剛經云無諍三昧人中最為第一也修行之人澄其心而神自清晋真人云心清意靜天堂路意亂心荒地獄門丹陽師云要知上天入地好弱由心孟子曰我善養吾浩然之氣故不動心太上云出家若不降心百年之後無得中處重陽真人云出家若不降心返接世緣道德損矣性命書云洗心對越乃萬物之根蒂經云心生則性滅心滅則性現也心滅者是寶經云諸賢先求明心心本是道道即是心心外無道道外無心也重陽真人授丹陽二十四訣
